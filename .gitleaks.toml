title = "Metro Parking App Gitleaks Config"

[extend]
useDefault = true

# VITE_* values are bundled into client code, so credential-like names must
# never contain real secret values.
[[rules]]
id = "vite-client-credential"
description = "Detect credentials assigned to browser-exposed Vite variables"
regex = '''(?i)VITE_[A-Z0-9_]*(API[_-]?KEY|CLIENT[_-]?SECRET|PASSWORD|PASSWD|SECRET|TOKEN)[A-Z0-9_]*\s*[:=]\s*["']?([A-Za-z0-9_./+=-]{16,})["']?'''
secretGroup = 2
entropy = 3.5

[allowlist]
description = "Ignore generated frontend output"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)dist/''',
  '''(^|/)coverage/''',
  '''(^|/)playwright-report/''',
  '''(^|/)test-results/''',
]
